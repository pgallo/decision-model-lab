[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-model-lab"
version = "0.1.0"
description = "Decision intelligence experiments: decision graphs, evidence fusion, simulation and explainable recommendations applied to four domains."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paolo Gallo" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
decision-lab = "decision_lab.cli:main"

[tool.setuptools.packages.find]
include = ["decision_lab*", "experiments*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
